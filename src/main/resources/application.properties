spring.application.name=dukani-ledger

# Database Configuration (Neon - cloud hosted)
# No real credentials default here on purpose - must be set via env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# Server Port
# Render (and most PaaS providers) inject PORT dynamically; falls back to 8080 locally.
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:dukaniLedgerSecretKeyForAuthenticationSystem2026VeryLongKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}